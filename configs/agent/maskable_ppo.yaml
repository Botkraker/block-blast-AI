name: maskable_ppo
seed: 0
policy: afterstate      # afterstate (scores each action's resulting board) | cnn (run ppo_v1)
prior: auto             # greedy lean of the afterstate policy: auto (board if reward=safe, else score) | score | board | lookahead
features_dim: 256       # CNN width: critic features (afterstate) or shared features (cnn)
ppo:
  n_steps: 256            # per env; rollout = n_steps × train.n_envs = 16384
  batch_size: 1024        # afterstate activations are (batch, 192, 128); fits 4 GB VRAM
  n_epochs: 4
  learning_rate: 3.0e-4   # decays linearly to 0
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch:
    pi: [256, 256]
    vf: [256, 256]
