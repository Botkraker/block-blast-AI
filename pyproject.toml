[project]
name = "blockblast"
version = "0.1.0"
description = "Reinforcement-learning agent that plays Block Blast (MaskablePPO)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "torch>=2.4",
    "stable-baselines3>=2.4",
    "sb3-contrib>=2.4",
    "tensorboard>=2.17",
    "hydra-core>=1.3",
    "imageio>=2.35",
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
capture = ["mss>=9.0", "opencv-python>=4.10", "pyautogui>=0.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blockblast"]

# CUDA wheels for torch on Windows/Linux (local GTX 1650). Colab uses its preinstalled torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["slow: long-running tests (excluded from the 60 s budget)"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# Frozen config dataclasses are safe as defaults.
extend-immutable-calls = ["blockblast.engine.scoring.ScoreConfig", "blockblast.env.reward.RewardConfig"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["blockblast"]

[[tool.mypy.overrides]]
module = ["stable_baselines3.*", "sb3_contrib.*", "gymnasium.*", "imageio.*", "hydra.*", "omegaconf.*"]
ignore_missing_imports = true
